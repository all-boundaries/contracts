# Local Pact Broker for development. Not a production deployment.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes:
      - broker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact"]
      interval: 3s
      timeout: 3s
      retries: 20

  broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@database/pact
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_BASE_URL: http://localhost:9292
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  broker-data:
