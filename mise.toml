[tools]
bun = "1.4.4"

[env]
# Colima; remove or override if Docker Desktop provides /var/run/docker.sock
DOCKER_HOST = "unix://{{env.HOME}}/.config/colima/default/docker.sock"
PACT_BROKER_BASE_URL = "{{ get_env(name='PACT_BROKER_BASE_URL', default='http://localhost:9292') }}"

[tasks.setup]
description = "Install the Pact CLI and the script dependencies"
run = "bun install"

[tasks.test]
description = "Test the pipeline scripts"
run = "bun test"

[tasks.check]
run = "bun run check"

[tasks.up]
description = "Start the local Pact Broker on http://localhost:9292 with the staging and production environments and nothing else"
depends = ["setup"]
run = ["docker compose up -d --wait", "bun scripts/broker-setup.ts"]

[tasks."broker:setup"]
description = "Make the broker named by PACT_BROKER_BASE_URL (with PACT_BROKER_USERNAME and PACT_BROKER_PASSWORD) ready: staging and production environments"
run = "bun scripts/broker-setup.ts"

[tasks.down]
description = "Stop the broker, keeping its data"
run = "docker compose down"

[tasks.reset]
description = "Stop the broker and delete its data and the simulated deployments"
run = ["docker compose down --volumes", "rm -rf .deployments"]

[tasks.simulate]
description = "Push to main in every service, providers first: ci:main for each (add -- --promote to go on to production)"
run = "bun scripts/simulate.ts"

[tasks."simulate:fresh"]
description = "Start from an empty broker and release every service through staging and production"
run = ["mise run reset", "mise run up", "bun scripts/simulate.ts --promote"]

[tasks."webhooks:create"]
description = "Create the Pact Broker webhooks that start each provider's verification on GitHub (needs GITHUB_DISPATCH_TOKEN)"
run = "bun scripts/webhooks.ts"
